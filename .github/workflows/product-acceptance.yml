name: product-acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance_environment:
        description: Protected product acceptance environment
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: product-acceptance-${{ inputs.acceptance_environment }}
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.resolve.outputs.product }}
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: resolve
        name: Resolve product environment
        shell: bash
        env:
          ACCEPTANCE_ENVIRONMENT: ${{ inputs.acceptance_environment }}
        run: |
          set -euo pipefail
          environment="${ACCEPTANCE_ENVIRONMENT}"
          if [[ ! "${environment}" =~ ^product-([a-z][a-z0-9_-]*)-acceptance$ ]]; then
            echo "environment must be named product-<name>-acceptance" >&2
            exit 2
          fi
          product="${BASH_REMATCH[1]}"
          if [[ ! -d "products/${product}" ]]; then
            echo "unknown product: ${product}" >&2
            exit 2
          fi
          printf 'product=%s\n' "${product}" >>"${GITHUB_OUTPUT}"
          printf 'environment=%s\n' "${environment}" >>"${GITHUB_OUTPUT}"

  acceptance:
    needs: resolve
    timeout-minutes: 120
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    env:
      TF_ACC: "1"
      UCLOUD_PUBLIC_KEY: ${{ secrets.UCLOUD_PUBLIC_KEY }}
      UCLOUD_PRIVATE_KEY: ${{ secrets.UCLOUD_PRIVATE_KEY }}
      UCLOUD_REGION: ${{ secrets.UCLOUD_REGION }}
      UCLOUD_PROJECT_ID: ${{ secrets.UCLOUD_PROJECT_ID }}
      TF_LOG: "OFF"
      TF_LOG_PROVIDER: "OFF"

    steps:
      - name: Mask cloud credentials
        shell: bash
        run: |
          for name in UCLOUD_PUBLIC_KEY UCLOUD_PRIVATE_KEY UCLOUD_PROJECT_ID; do
            value="${!name}"
            if [[ -n "${value}" ]]; then
              printf '::add-mask::%s\n' "${value}"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.19.5"
      - name: Run product acceptance tests
        shell: bash
        env:
          PRODUCT: ${{ needs.resolve.outputs.product }}
        run: |
          set -uo pipefail
          case "${PRODUCT}" in
            *[!a-z0-9_-]*|'')
              echo "invalid product name" >&2
              exit 2
              ;;
          esac
          if [[ ! -d "products/${PRODUCT}" ]]; then
            echo "unknown product: ${PRODUCT}" >&2
            exit 2
          fi

          if ! go test "./products/${PRODUCT}" -list '^TestAcc' | grep -q '^TestAcc'; then
            echo "product ${PRODUCT} has no acceptance tests" >&2
            exit 3
          fi

          raw_log="$(mktemp "${RUNNER_TEMP}/product-acceptance.XXXXXX.log")"
          cleanup() {
            rm -f "${raw_log}"
          }
          trap cleanup EXIT

          go test "./products/${PRODUCT}" -run '^TestAcc' -v -count=1 -timeout=120m >"${raw_log}" 2>&1
          test_rc=$?
          perl -pe '
            s/((?:PublicKey|PrivateKey|Signature|SecurityToken|AccessKeyId|AccessKeySecret|public_key|private_key|security_token|access_key_id|access_key_secret|Authorization|Cookie|Csrf-Token|csrf_token)(?:=|%3D))[^&\s]+/${1}[REDACTED]/gi;
            s/("(?:PublicKey|PrivateKey|Signature|SecurityToken|AccessKeyId|AccessKeySecret|public_key|private_key|security_token|access_key_id|access_key_secret|Authorization|Cookie|Csrf-Token|csrf_token)"\s*:\s*")[^"]+/${1}[REDACTED]/gi;
          ' "${raw_log}" || exit 1
          exit "${test_rc}"

  upgrade:
    needs: [resolve, acceptance]
    if: ${{ github.ref == 'refs/heads/master' && needs.resolve.outputs.product == 'us3' }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment }}
    env:
      UCLOUD_PUBLIC_KEY: ${{ secrets.UCLOUD_PUBLIC_KEY }}
      UCLOUD_PRIVATE_KEY: ${{ secrets.UCLOUD_PRIVATE_KEY }}
      UCLOUD_REGION: ${{ secrets.UCLOUD_REGION }}
      UCLOUD_PROJECT_ID: ${{ secrets.UCLOUD_PROJECT_ID }}
      TF_VAR_bucket_name: tf-compat-${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_bucket_type: private
      TF_LOG: "OFF"
      TF_LOG_PROVIDER: "OFF"

    steps:
      - name: Mask cloud credentials
        shell: bash
        run: |
          for name in UCLOUD_PUBLIC_KEY UCLOUD_PRIVATE_KEY UCLOUD_PROJECT_ID; do
            value="${!name}"
            if [[ -n "${value}" ]]; then
              printf '::add-mask::%s\n' "${value}"
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.19.5"
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Build current provider
        run: |
          mkdir -p /tmp/ucloud-provider-compat
          go build -o /tmp/ucloud-provider-compat/terraform-provider-ucloud .
      - name: Verify released-to-current upgrade
        run: |
          set -euo pipefail
          compat_dir="${RUNNER_TEMP}/us3-upgrade"
          mkdir -p "${compat_dir}"
          cp -R products/us3/test-fixtures/upgrade/. "${compat_dir}/"
          cd "${compat_dir}"

          cleanup() {
            terraform destroy -auto-approve -input=false || {
              unset TF_CLI_CONFIG_FILE
              terraform destroy -auto-approve -input=false || true
            }
          }
          trap cleanup EXIT

          terraform init -input=false
          terraform apply -auto-approve -input=false

          export TF_CLI_CONFIG_FILE="${GITHUB_WORKSPACE}/products/us3/test-fixtures/upgrade/dev.tfrc"
          terraform plan -detailed-exitcode -input=false

          export TF_VAR_bucket_type=public
          terraform apply -auto-approve -input=false
          terraform plan -detailed-exitcode -input=false
          terraform destroy -auto-approve -input=false
          trap - EXIT
