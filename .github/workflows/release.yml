# Release automation
#
# Triggers:
#   - workflow_run: release right after the master "test" workflow succeeds
#     (the normal path for a human-merged PR).
#   - push (tag v*): resume an already-pushed release tag.
#   - schedule / workflow_dispatch: weekly (and manual) fallback that plans a
#     release straight from origin/master. This is required because GitHub
#     suppresses workflow events caused by refs pushed with the default
#     GITHUB_TOKEN, so a native auto-merge performed by github-actions[bot]
#     leaves no test run behind and the workflow_run path never fires.
#     See ucloud/ucloud-cli (.github/workflows/release.yml) for the same design.
#
# The version/tag decision is always delegated to scripts/release-policy.sh:
# plan-auto for CI/fallback triggers, plan-tag for an existing tag push.

name: release

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [master]
  push:
    tags:
      - "v*"
  schedule:
    # Mondays 23:00 Asia/Shanghai (15:00 UTC).
    - cron: "0 15 * * 1"
  # Manual trigger for an urgent release or a guarded dry run.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  goreleaser:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Fetch release history
        run: git fetch --force --tags origin '+refs/heads/master:refs/remotes/origin/master'
      - id: plan
        name: Resolve release intent and version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            push)
              bash scripts/release-policy.sh plan-tag
              ;;
            workflow_run)
              bash scripts/release-policy.sh plan-auto
              ;;
            schedule | workflow_dispatch)
              # Fallback path: publish whatever master holds right now, using
              # the exact tip of the freshly fetched default branch as the
              # release target (a manual run may have been dispatched on
              # another ref).
              RELEASE_TARGET_SHA="$(git rev-parse refs/remotes/origin/master)"
              export RELEASE_TARGET_SHA
              bash scripts/release-policy.sh plan-auto
              ;;
            *)
              echo "unsupported triggering event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
      - name: Check out release revision
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: git checkout --detach "${RELEASE_SHA}"
      - name: Set up Go
        if: steps.plan.outputs.release == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GoReleaser configuration
        if: steps.plan.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: check
      - name: Import GPG key
        if: steps.plan.outputs.release == 'true'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Create release tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.existing_tag != 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Run GoReleaser
        if: steps.plan.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.plan.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
